name: CI

on:
  # Gate merges into env branches (the checks you will *require*)
  pull_request:
    branches: [development, test, staging, main]
    types: [opened, synchronize, reopened]

  # Optional: fast feedback while you work on PR branches (feature, improve, bugfix, hotfix)
  push:
    branches:
      - "feature/**"
      - "improve/**"
      - "bugfix/**"
      - "hotfix/**"

concurrency:
  group: ci-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db?schema=public

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26.4.0"
          cache: "npm"

      - name: Setup npm
        run: npm install -g npm@11.17.0

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run Prisma migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Run tests
        run: npm test -- --testPathIgnorePatterns='/tests/controllers/.*\\.test\\.ts$'
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test
          PORT: "8083"
          TRUST_PROXY: "0"
          SESSION_SECRET: test-session-secret
          REDIS_URL: redis://localhost:6379
          REDIS_PASSWORD: ""
          RABBITMQ_URL: amqp://localhost:5672
          RABBITMQ_QUEUE_PREFIX: audiobook
          RABBITMQ_MESSAGE_TTL: "3600000"
          BULL_REDIS_HOST: redis://localhost:6379
          BULL_JOB_TIMEOUT: "3600000"
          BULL_MAX_ATTEMPTS: "3"
          BULL_BACKOFF_DELAY: "30000"
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_PATH: ./storage
          AWS_S3_BUCKET: ""
          AWS_S3_REGION: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_S3_ENDPOINT: ""
          AWS_SIGNED_URL_EXPIRES_IN: "3600"
          FFMPEG_PATH: ffmpeg
          FFPROBE_PATH: ffprobe
          HLS_SEGMENT_DURATION: "4"
          TRANSCODING_BITRATES: "[64, 128, 256]"
          STREAMING_CACHE_TTL: "3600"
          STREAMING_BASE_URL: http://localhost:8083
          RATE_LIMIT_WINDOW_MS: "900000"
          RATE_LIMIT_MAX_REQUESTS: "100"
          LOG_LEVEL: error
          LOG_DIR: ./logs
          HEALTH_CHECK_INTERVAL: "30000"
          TRANSCODING_TIMEOUT: "3600000"
          MAX_TRANSCODING_WORKERS: "2"
          CACHE_TTL: "3600"
          AUTH_SERVICE_URL: http://localhost:8080
          JWKS_ENDPOINT: http://localhost:8080/auth/.well-known/jwks.json

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DATABASE_URL }}
          NODE_ENV: test
          PORT: "8083"
          TRUST_PROXY: "0"
          SESSION_SECRET: test-session-secret
          REDIS_URL: redis://localhost:6379
          REDIS_PASSWORD: ""
          RABBITMQ_URL: amqp://localhost:5672
          RABBITMQ_QUEUE_PREFIX: audiobook
          RABBITMQ_MESSAGE_TTL: "3600000"
          BULL_REDIS_HOST: redis://localhost:6379
          BULL_JOB_TIMEOUT: "3600000"
          BULL_MAX_ATTEMPTS: "3"
          BULL_BACKOFF_DELAY: "30000"
          STORAGE_PROVIDER: local
          LOCAL_STORAGE_PATH: ./storage
          AWS_S3_BUCKET: ""
          AWS_S3_REGION: ""
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_S3_ENDPOINT: ""
          AWS_SIGNED_URL_EXPIRES_IN: "3600"
          FFMPEG_PATH: ffmpeg
          FFPROBE_PATH: ffprobe
          HLS_SEGMENT_DURATION: "4"
          TRANSCODING_BITRATES: "[64, 128, 256]"
          STREAMING_CACHE_TTL: "3600"
          STREAMING_BASE_URL: http://localhost:8083
          RATE_LIMIT_WINDOW_MS: "900000"
          RATE_LIMIT_MAX_REQUESTS: "100"
          LOG_LEVEL: error
          LOG_DIR: ./logs
          HEALTH_CHECK_INTERVAL: "30000"
          TRANSCODING_TIMEOUT: "3600000"
          MAX_TRANSCODING_WORKERS: "2"
          CACHE_TTL: "3600"
          AUTH_SERVICE_URL: http://localhost:8080
          JWKS_ENDPOINT: http://localhost:8080/auth/.well-known/jwks.json

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
